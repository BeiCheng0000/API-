# ============================================
# 接口自动化测试平台 - 主配置文件
# ============================================
# ⚠️ 敏感信息（密码、Token）请通过 .env 环境变量设置，不要直接填写在此文件中
# ⚠️ 默认环境为 dev，请勿直接使用 prod 环境运行测试
# ============================================

# 当前测试环境：dev / test / staging / prod
# ⚠️ 默认应为 dev，避免误操作生产环境
env:
  current: dev

# 日志配置
log:
  level: INFO             # 日志级别: DEBUG / INFO / WARNING / ERROR
  rotation: "10 MB"       # 单个日志文件大小，超过后自动轮转
  retention: "30 days"    # 日志文件保留时间
  encoding: utf-8         # 日志文件编码
  format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

# 数据库配置（可选，使用数据库功能时需要）
# ⚠️ 密码请通过环境变量 DB_PASSWORD / MONGO_PASSWORD 设置
database:
  mysql:
    host: localhost
    port: 3306
    user: root
    password: ""           # ⚠️ 请通过环境变量 DB_PASSWORD 设置，不要在此填写
    database: test_db
    charset: utf8mb4
    connect_timeout: 3      # 连接超时时间（秒），避免长时间等待
    read_timeout: 5         # 读取超时时间（秒），避免查询长时间阻塞
    write_timeout: 5        # 写入超时时间（秒），避免写入长时间阻塞
  mongodb:
    host: localhost
    port: 27017
    user: ""
    password: ""           # ⚠️ 请通过环境变量 MONGO_PASSWORD 设置，不要在此填写
    database: test_db

# 邮件配置（可选，用于测试报告通知）
# ⚠️ 密码请通过环境变量 EMAIL_PASSWORD 设置
email:
  smtp_server: smtp.example.com
  smtp_port: 587
  sender: test@example.com
  password: ""             # ⚠️ 请通过环境变量 EMAIL_PASSWORD 设置，不要在此填写
  receivers:
    - receiver1@example.com
    - receiver2@example.com

# 项目信息
project:
  name: 接口自动化测试平台
  description: 基于Python的接口自动化测试平台
  version: 1.0.0

# 报告配置
report:
  allure:
    history: 20            # Allure 报告保留的历史运行次数
