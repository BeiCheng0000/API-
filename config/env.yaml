# 环境配置文件
# 每个环境包含 base_url、timeout、headers 和 auth 配置
# ⚠️ auth.token 建议通过 .env 环境变量设置，不要直接填写在此文件中

# 开发环境配置
dev:
  base_url: https://dev-api.example.com  # 修改为你的开发环境 API 地址
  timeout: 30
  headers:
    Content-Type: application/json
    Accept: application/json
  auth:
    type: bearer  # bearer/basic/none
    token: ""  # ⚠️ 建议使用环境变量 API_TOKEN

# 测试环境配置
test:
  base_url: http://test.example.com/api
  timeout: 30
  headers:
    Content-Type: application/json
    Accept: application/json
  auth:
    type: bearer
    token: ""  # ⚠️ 建议使用环境变量 API_TOKEN

# 预发布环境配置
staging:
  base_url: http://staging.example.com/api
  timeout: 30
  headers:
    Content-Type: application/json
    Accept: application/json
  auth:
    type: bearer
    token: ""  # ⚠️ 建议使用环境变量 API_TOKEN

# 生产环境配置
# ⚠️ 生产环境地址建议通过环境变量 PROD_BASE_URL 注入，不要将真实地址提交到代码仓库
prod:
  base_url: https://prod-api.example.com  # ⚠️ 修改为你的生产环境 API 地址，建议通过环境变量设置
  timeout: 30
  headers:
    Content-Type: application/json
    Accept: application/json
  auth:
    type: bearer
    token: ""  # ⚠️ 建议使用环境变量 API_TOKEN
