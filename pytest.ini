[pytest]
# 命令行参数
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --alluredir=./reports/allure-results
    --clean-alluredir

# 测试用例目录
testpaths = testcases

# 测试文件模式
python_files = test_*.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 标记定义
markers =
    smoke: 冒烟测试
    regression: 回归测试
    api: 接口测试
    critical: 关键测试
    high: 高优先级
    medium: 中优先级
    low: 低优先级
