# ============================================
# pytest 配置文件
# ============================================
# 文档：https://docs.pytest.org/en/stable/reference/customize.html#configuration-file-format
# ============================================

[pytest]
# 命令行参数（每次运行 pytest 时自动附加）
addopts = 
    --strict-markers       # 未注册的标记将报错，防止拼写错误
    --strict-config        # 配置文件中的未知选项将报错
    --verbose              # 显示详细输出
    --tb=short             # 回溯信息使用短格式
    --alluredir=./reports/allure-results  # Allure 报告输出目录
    --clean-alluredir      # 每次运行前清空 Allure 报告目录

# 测试用例搜索目录
testpaths = testcases

# 测试文件匹配模式（仅匹配 test_ 开头的 .py 文件）
python_files = test_*.py

# 测试类匹配模式（仅匹配 Test 开头的类，且不含 __init__ 方法）
python_classes = Test*

# 测试函数匹配模式（仅匹配 test_ 开头的函数）
python_functions = test_*

# 自定义标记定义（配合 --strict-markers 使用，未在此注册的标记将报错）
# 使用方式：@pytest.mark.smoke
markers =
    smoke: 冒烟测试 - 验证核心功能是否正常
    regression: 回归测试 - 验证已有功能未被破坏
    api: 接口测试 - API 接口级别测试
    critical: 关键测试 - 阻塞级别，必须通过
    high: 高优先级 - 重要功能测试
    medium: 中优先级 - 一般功能测试
    low: 低优先级 - 边缘场景测试
